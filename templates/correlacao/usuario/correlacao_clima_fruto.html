<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Correlação Clima × Fruto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/correlacao/usuario/correlacao_clima_fruto.css') }}">
</head>

<body>

<header>
    <h1>Correlação Sensor × Fruto</h1>
</header>

<main>

<a href="{{ url_for('user_bp.painel_usuario') }}" class="btn-voltar">Voltar</a>

<form method="POST" class="form-corre">

    <!-- SENSOR -->
    <div class="campo">

        <label>Sensor</label>

        <select name="sensor" required>

            <option value="">Escolha</option>

            <option value="temperatura_ar">
                Temperatura
            </option>

            <option value="umidade_ar">
                Umidade Ar
            </option>

            <option value="umidade_solo">
                Umidade Solo
            </option>

            <option value="radiacao_uv">
                Radiação UV
            </option>

        </select>

    </div>

    <!-- FRUTO -->
    <div class="campo">

        <label>Fruto</label>

        <select name="nome_fruto" required>

            <option value="">Escolha</option>

            {% if frutos %}

                {% for f in frutos %}

                    <option value="{{ f }}">
                        {{ f }}
                    </option>

                {% endfor %}

            {% else %}

                <option disabled>
                    Nenhum fruto cadastrado
                </option>

            {% endif %}

        </select>

    </div>

    <!-- ATRIBUTO -->
    <div class="campo">

        <label>Atributo</label>

        <select name="atributo" required>

            <option value="">Escolha</option>

            <option value="frutose">
                Frutose
            </option>

            <option value="peso">
                Peso
            </option>

            <option value="tamanho">
                Tamanho
            </option>

            <option value="acidez">
                Acidez
            </option>

        </select>

    </div>

    <!-- DATA INICIO -->
    <div class="campo">

        <label>Data início</label>

        <input type="date"
               name="data_inicio">

    </div>

    <!-- DATA FIM -->
    <div class="campo">

        <label>Data fim</label>

        <input type="date"
               name="data_fim">

    </div>

    <button type="submit"
            class="btn-gerar">

        Gerar Correlação

    </button>

</form>

<!-- AVISO -->
{% if aviso %}

<div class="aviso">

    {{ aviso }}

</div>

{% endif %}

<!-- CORRELAÇÃO -->
{% if correlacao is not none %}

<div class="resultado">

    <h2>
        Correlação: {{ correlacao }}
    </h2>

</div>

{% endif %}

<!-- GRAFICO -->
{% if graphHTML %}

<div class="resultado">

    {{ graphHTML | safe }}

</div>

{% endif %}

</main>

</body>
</html>
