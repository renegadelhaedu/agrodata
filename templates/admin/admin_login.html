<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Login Administrativo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<header>

    <h1>AgroData Admin</h1>

</header>

<div class="login-container">

    <h2>Login do Administrador</h2>

    <form method="POST">

        <label>Usuário</label>

        <input type="text"
               name="usuario"
               required>

        <label>Senha</label>

        <input type="password"
               name="senha"
               required>

        <button type="submit">

            Entrar

        </button>

    </form>

    <a href="/"
       class="btn-voltar">

        Voltar

    </a>

</div>

</body>
</html>
