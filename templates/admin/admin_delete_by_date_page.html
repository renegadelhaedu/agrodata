<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Excluir Leituras</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>


{% include 'admin/admin_base.html' %}

<header>

    <h1>Excluir Leituras por Data</h1>

</header>

<main>

<div class="card">

    <h2>Gerenciamento de Sensores</h2>

    <p>

        Remova leituras antigas ou inconsistentes
        utilizando filtros por intervalo de datas.

    </p>

</div>

<form method="POST"
      action="/admin/delete_by_date"
      class="filter-form">

    <label>Sensor:</label>

    <select name="sensor" required>

        <option value="temperatura_ar">
            Temperatura do Ar
        </option>

        <option value="umidade_ar">
            Umidade do Ar
        </option>

        <option value="umidade_solo">
            Umidade do Solo
        </option>

        <option value="radiacao">
            Radiação
        </option>

    </select>

    <label>Data Início:</label>

    <input type="date"
           name="data_inicio"
           required>

    <label>Data Fim:</label>

    <input type="date"
           name="data_fim"
           required>

    <button type="submit"
            class="btn-delete">

        Excluir Leituras

    </button>

</form>

</main>
<script>

const dropdowns = document.querySelectorAll(".dropdown-btn");

dropdowns.forEach(btn => {

    btn.addEventListener("click", function () {

        const container = this.nextElementSibling;

        container.classList.toggle("active");

    });

});

</script>
</body>
</html>
