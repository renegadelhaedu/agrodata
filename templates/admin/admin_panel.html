<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>


{% include 'admin/admin_base.html' %}

<header>

    <h1>Painel Administrativo</h1>

</header>

<main>


<form class="filter-form"
      method="GET"
      action="{{ url_for('admin_bp.filtrar_leituras') }}">

    <label>Início:</label>

    <input type="datetime-local"
           name="data_inicio"
           value="{{ request.args.get('data_inicio', '') }}">

    <label>Fim:</label>

    <input type="datetime-local"
           name="data_fim"
           value="{{ request.args.get('data_fim', '') }}">

    <label>Tipo:</label>

    <select name="tipo">

        <option value="">
            Todos
        </option>

        {% for s in sensores %}

            <option value="{{ s }}"
            {% if request.args.get('tipo') == s %}
                selected
            {% endif %}
            >

                {{ s }}

            </option>

        {% endfor %}

    </select>

    <button type="submit">
        Filtrar
    </button>

</form>

<table>

    <tr>

        <th>ID</th>
        <th>Sensor</th>
        <th>Tipo</th>
        <th>Valor</th>
        <th>Data</th>
        <th>Ações</th>

    </tr>

    {% for l in leituras %}

    <tr>

        <td>{{ l.id }}</td>
        <td>{{ l.sensor_id }}</td>
        <td>{{ l.tipo }}</td>
        <td>{{ l.valor }}</td>
        <td>{{ l.timestamp }}</td>

        <td>

            <form method="POST"
                  action="{{ url_for('admin_bp.admin_delete_by_id', id=l.id) }}">

                <button type="submit"
                        class="btn-delete"
                        onclick="return confirm('Deseja excluir esta leitura?')">

                    Excluir

                </button>

            </form>

        </td>

    </tr>

    {% endfor %}

</table>

</main>

<script>

const dropdowns = document.querySelectorAll(".dropdown-btn");

dropdowns.forEach(btn => {

    btn.addEventListener("click", function () {

        const container = this.nextElementSibling;

        container.classList.toggle("active");

    });

});

</script>

</body>
</html>
